# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# FarmFresh — Application Configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Application ──
spring.application.name=farmfresh3-backend
server.port=8080

# ── MySQL Database Connection ──
spring.datasource.url=jdbc:mysql://localhost:3306/farmfresh3_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Appaa@1311
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP Connection Pool ──
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT Configuration ──
# IMPORTANT: Change this secret before production. Min 256 bits (32 chars).
app.jwt.secret=YourSuperSecretKeyForJwtSigning123456789
app.jwt.expiration=86400000

# ── Logging ──
logging.level.com.example.freshfarm3=DEBUG
logging.level.org.springframework.security=DEBUG
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Razorpay Configuration ──
razorpay.key-id=your_razorpay_key_id
razorpay.key-secret=your_razorpay_key_secret