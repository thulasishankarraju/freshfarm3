<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="img/logo-icon.png">
<title>Forgot password — FarmFresh</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toast-root"></div>
<div id="nav"></div>

<div class="container auth-wrap">
  <div style="text-align:center;margin-bottom:18px;">
    <img src="img/logo-full.png" alt="FreshFarm — Empowering shops, enriching lives" style="height:110px;">
  </div>
  <div class="card">
    <h2>Reset your password</h2>

    <div id="stage1">
      <p class="muted">Choose how to receive your reset code.</p>
      <div id="stage1-alert"></div>
      <label>Send code via</label>
      <select id="channel">
        <option value="EMAIL">Email</option>
        <option value="PHONE">Phone (SMS)</option>
      </select>
      <label id="recipientLabel">Registered email</label>
      <input id="recipient" required placeholder="you@example.com">
      <label>Account type</label>
      <select id="role">
        <option value="BUYER">Buyer</option>
        <option value="SHOP">Shop</option>
        <option value="AGENT">Delivery Agent</option>
        <option value="ADMIN">Admin</option>
      </select>
      <button class="btn btn-primary btn-block" style="margin-top:16px" id="sendOtpBtn">Send reset code</button>
    </div>

    <div id="stage2" style="display:none;">
      <div class="alert alert-ok" style="margin-top:10px;">Code sent — check your inbox/phone.</div>
      <div id="stage2-alert"></div>
      <label>Enter the 6-digit code</label>
      <input id="otpCode" maxlength="6" placeholder="123456">
      <label>New password (min 8 characters)</label>
      <input type="password" id="newPassword" minlength="8">
      <label>Confirm new password</label>
      <input type="password" id="confirmPassword" minlength="8">
      <button class="btn btn-primary btn-block" style="margin-top:16px" id="resetBtn">Reset password</button>
      <button class="btn btn-outline btn-block" style="margin-top:8px" id="backBtn">Use a different email/phone</button>
    </div>

    <p class="muted" style="margin-top:16px;"><a href="login.html">← Back to login</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
const channelSel = document.getElementById("channel");
const recipientInput = document.getElementById("recipient");
const recipientLabel = document.getElementById("recipientLabel");

channelSel.addEventListener("change", () => {
  if (channelSel.value === "EMAIL") {
    recipientLabel.textContent = "Registered email";
    recipientInput.placeholder = "you@example.com";
  } else {
    recipientLabel.textContent = "Registered phone (10-digit)";
    recipientInput.placeholder = "9876543210";
  }
});

function normalizedRecipient() {
  const channel = channelSel.value;
  let recipient = recipientInput.value.trim();
  if (channel === "PHONE" && !recipient.startsWith("+")) recipient = "+91" + recipient;
  return recipient;
}

document.getElementById("sendOtpBtn").addEventListener("click", async () => {
  const box = document.getElementById("stage1-alert");
  box.innerHTML = "";
  const recipient = normalizedRecipient();
  if (!recipient) { box.innerHTML = `<div class="alert alert-err">Enter your email or phone.</div>`; return; }

  try {
    await api.forgotPasswordSendOtp({
      recipient,
      channel: channelSel.value,
      purpose: "FORGOT_PASSWORD"
    });
    toast("Reset code sent");
    document.getElementById("stage1").style.display = "none";
    document.getElementById("stage2").style.display = "block";
  } catch (e) {
    box.innerHTML = `<div class="alert alert-err">${e.message}</div>`;
  }
});

document.getElementById("backBtn").addEventListener("click", () => {
  document.getElementById("stage2").style.display = "none";
  document.getElementById("stage1").style.display = "block";
});

document.getElementById("resetBtn").addEventListener("click", async () => {
  const box = document.getElementById("stage2-alert");
  box.innerHTML = "";
  const code = document.getElementById("otpCode").value.trim();
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (!code) { box.innerHTML = `<div class="alert alert-err">Enter the code you received.</div>`; return; }
  if (newPassword.length < 8) { box.innerHTML = `<div class="alert alert-err">Password must be at least 8 characters.</div>`; return; }
  if (newPassword !== confirmPassword) { box.innerHTML = `<div class="alert alert-err">Passwords don't match.</div>`; return; }

  try {
    await api.resetPassword({
      recipient: normalizedRecipient(),
      otpCode: code,
      newPassword,
      role: document.getElementById("role").value
    });
    toast("Password reset — please log in");
    location.href = "login.html";
  } catch (e) {
    box.innerHTML = `<div class="alert alert-err">${e.message}</div>`;
  }
});
</script>
</body>
</html>
