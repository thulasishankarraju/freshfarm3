<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="../img/logo-icon.png">
<title>Farmer approvals — FarmFresh</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="toast-root"></div>
<div id="nav"></div>

<div class="container page">
  <h2>Farmer approvals</h2>
  <p class="muted">Only pending farmers are exposed by the backend (<code>GET /api/admin/farmers/pending</code>) — there's no endpoint to list already-approved or rejected farmers.</p>
  <div id="box"><p class="muted">Loading…</p></div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script>
if (requireAuth(["ADMIN"])) load();

async function load() {
  const box = document.getElementById("box");
  try {
    const farmers = await api.pendingFarmers();
    if (!farmers.length) { box.innerHTML = `<div class="empty"><h3>All caught up</h3><p>No farmers awaiting approval.</p></div>`; return; }
    box.innerHTML = `
      <table class="card">
        <thead><tr><th>Farmer</th><th>Farm</th><th>Contact</th><th>Registered</th><th></th></tr></thead>
        <tbody>
          ${farmers.map(f => `
            <tr>
              <td>${f.farmerName}</td>
              <td>${f.farmName || ''}<br><span class="muted">${f.farmLocation || ''}</span></td>
              <td>${f.email}<br><span class="muted">${f.phone || ''}</span></td>
              <td>${f.registeredDate || ''}</td>
              <td>
                <button class="btn btn-primary btn-sm" onclick="approve(${f.farmerId})">Approve</button>
                <button class="btn btn-danger btn-sm" onclick="reject(${f.farmerId})">Reject</button>
              </td>
            </tr>`).join("")}
        </tbody>
      </table>`;
  } catch (e) {
    box.innerHTML = `<div class="alert alert-err">${e.message}</div>`;
  }
}

async function approve(id) { try { await api.approveFarmer(id); toast("Farmer approved"); load(); } catch (e) { toast(e.message, "err"); } }
async function reject(id) { try { await api.rejectFarmer(id); toast("Farmer rejected"); load(); } catch (e) { toast(e.message, "err"); } }
</script>
</body>
</html>
