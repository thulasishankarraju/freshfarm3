  async function load() {
    const box = document.getElementById("box");
    try {
      const deliveries = await api.myDeliveries();
      if (!deliveries.length) { box.innerHTML = `<div class="empty"><h3>No deliveries assigned yet</h3></div>`; return; }

      box.innerHTML = deliveries.map(d => `
      <div class="card" style="margin-bottom:14px;">
        <div class="flex-between">
          <div><strong>${d.orderNumber}</strong> <span class="badge badge-active">${d.deliveryStatus}</span></div>
          <strong>${money(d.agentEarning)}</strong>
        </div>
        <p class="muted" style="margin-top:6px;">Assigned ${d.assignedAt ? new Date(d.assignedAt).toLocaleString() : ''}</p>
        ${renderActions(d)}
      </div>`).join("");

      document.querySelectorAll("[data-pickup]").forEach(btn =>
              btn.addEventListener("click", () => act(btn.dataset.pickup, api.pickupDelivery, "Marked picked up")));
      document.querySelectorAll("[data-out]").forEach(btn =>
              btn.addEventListener("click", () => act(btn.dataset.out, api.outForDelivery, "Marked out for delivery")));
      document.querySelectorAll("[data-complete]").forEach(btn =>
              btn.addEventListener("click", async () => {
                const deliveryId = btn.dataset.complete;
                const otpInput = document.getElementById(`otpInput-${deliveryId}`);
                const otp = otpInput.value.trim();
                if (!otp) { toast("Enter the delivery OTP", "err"); return; }
                try {
                  await api.completeDelivery(deliveryId, otp);
                  toast("Delivery completed");
                  load();
                  loadEarnings();
                } catch (e) { toast(e.message, "err"); }
              }));

    } catch (e) {
      box.innerHTML = `<div class="alert alert-err">${e.message}</div>`;
    }
  }

  function renderActions(d) {
    if (d.deliveryStatus === "ASSIGNED") {
      return `<button class="btn btn-primary btn-sm" style="margin-top:10px;" data-pickup="${d.deliveryId}">Mark picked up</button>`;
    }
    if (d.deliveryStatus === "PICKED_UP") {
      return `<button class="btn btn-primary btn-sm" style="margin-top:10px;" data-out="${d.deliveryId}">Mark out for delivery</button>`;
    }
    if (d.deliveryStatus === "OUT_FOR_DELIVERY") {
      return `
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center;">
        <input id="otpInput-${d.deliveryId}" placeholder="Delivery OTP" style="width:140px;">
        <button class="btn btn-primary btn-sm" data-complete="${d.deliveryId}">Complete delivery</button>
      </div>`;
    }
    return '';
  }

  async function act(deliveryId, fn, msg) {
    try {
      await fn(deliveryId);
      toast(msg);
      load();
    } catch (e) { toast(e.message, "err"); }
  }
</script>
