<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="../img/logo-icon.png">
<title>Shop dashboard — FarmFresh</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="toast-root"></div>
<div id="nav"></div>

<div class="container page">
  <h2>Shop dashboard</h2>
  <div id="stats" class="grid grid-3" style="margin-bottom:30px;"><p class="muted">Loading…</p></div>

  <div class="section-head"><h3>Orders on my products</h3></div>
  <div id="ordersBox"><p class="muted">Loading…</p></div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script>
if (requireAuth(["SHOP"])) { loadStats(); loadOrders(); }

async function loadStats() {
  const box = document.getElementById("stats");
  try {
    // GET /api/shop/dashboard — returns shopId, ownerName, shopName,
    // activeProducts, inactiveProducts, outOfStock, totalProducts
    const d = await api.shopDashboard();
    box.innerHTML = `
      <div class="stat"><div class="num">${d.activeProducts ?? 0}</div><div class="label">Active products</div></div>
      <div class="stat"><div class="num">${d.inactiveProducts ?? 0}</div><div class="label">Inactive</div></div>
      <div class="stat"><div class="num">${d.outOfStock ?? 0}</div><div class="label">Out of stock</div></div>
      <div class="stat"><div class="num">${d.totalProducts ?? 0}</div><div class="label">Total products (${d.shopName || ''})</div></div>
    `;
  } catch (e) {
    box.innerHTML = `<div class="alert alert-err">${e.message}</div>`;
  }
}

async function loadOrders() {
  const box = document.getElementById("ordersBox");
  try {
    const orders = await api.shopOrders();
    if (!orders.length) { box.innerHTML = `<p class="muted">No orders yet.</p>`; return; }
    box.innerHTML = orders.map(o => `
      <div class="card" style="margin-bottom:12px;">
        <div class="flex-between">
          <div><strong>${o.orderNumber}</strong> <span class="badge badge-active">${o.orderStatus}</span></div>
          <strong>${money(o.netEarnings)}</strong>
        </div>
        <p class="muted" style="margin-top:6px;">${o.items.map(i => i.productName + ' × ' + formatQty(i.quantity, i.unitType)).join(', ')}</p>
        <div class="muted" style="font-size:.82rem;margin-top:6px;border-top:1px solid var(--line);padding-top:6px;">
          Your earnings: ${money(o.grossEarnings)} − platform fee ${money(o.platformFee)} = <strong>${money(o.netEarnings)}</strong> net
        </div>
      </div>`).join("");
  } catch (e) {
    box.innerHTML = `<div class="alert alert-err">${e.message}</div>`;
  }
}
</script>
</body>
</html>
