<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="img/logo-icon.png">
<title>My subscriptions — FarmFresh</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toast-root"></div>
<div id="nav"></div>

<div class="container page">
  <h2>My subscriptions</h2>
  <p class="muted">Recurring deliveries you've set up from product pages.</p>
  <div id="box"><p class="muted">Loading…</p></div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
if (requireAuth(["BUYER"])) load();

async function load() {
  const box = document.getElementById("box");
  try {
    const subs = await api.mySubscriptions();
    if (!subs.length) {
      box.innerHTML = `<div class="empty"><h3>No subscriptions yet</h3><p>Set one up from any product page.</p></div>`;
      return;
    }
    box.innerHTML = subs.map(s => `
      <div class="card" style="margin-bottom:14px;">
        <div class="flex-between">
          <div>
            <strong>${s.productName}</strong>
            <span class="muted"> · Qty ${s.quantity} · ${s.frequency}</span>
            ${s.paused ? '<span class="badge badge-inactive">Paused</span>' : '<span class="badge badge-active">Active</span>'}
          </div>
          <div style="display:flex;gap:8px;">
            ${s.paused
              ? `<button class="btn btn-outline btn-sm" onclick="resume(${s.id})">Resume</button>`
              : `<button class="btn btn-outline btn-sm" onclick="pause(${s.id})">Pause</button>`}
            <button class="btn btn-danger btn-sm" onclick="cancel(${s.id})">Cancel</button>
          </div>
        </div>
        <p class="muted" style="margin:6px 0 0;">Next delivery: ${s.nextDeliveryDate || "—"} · Started ${s.startDate}</p>
      </div>`).join("");
  } catch (e) {
    box.innerHTML = `<div class="alert alert-err">${e.message}</div>`;
  }
}

async function pause(id) { try { await api.pauseSubscription(id); load(); } catch (e) { toast(e.message, "err"); } }
async function resume(id) { try { await api.resumeSubscription(id); load(); } catch (e) { toast(e.message, "err"); } }
async function cancel(id) {
  if (!confirm("Cancel this subscription?")) return;
  try { await api.deleteSubscription(id); toast("Subscription cancelled"); load(); } catch (e) { toast(e.message, "err"); }
}
</script>
</body>
</html>
