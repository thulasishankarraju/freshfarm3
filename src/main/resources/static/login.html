<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="img/logo-icon.png">
<title>Log in — FarmFresh</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toast-root"></div>
<div id="nav"></div>

<div class="container auth-wrap">
  <div style="text-align:center;margin-bottom:18px;">
    <img src="img/logo-full.png" alt="FreshFarm — Empowering farmers, enriching lives" style="height:120px;">
  </div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" data-tab="std">Buyer / Farmer / Admin</div>
      <div class="tab" data-tab="agent">Delivery Agent</div>
    </div>

    <div class="tab-panel active" id="panel-std">
      <h2>Welcome back</h2>
      <p class="muted">Log in with the account you registered as a buyer or farmer. Admin uses the same form.</p>
      <div id="std-alert"></div>
      <form id="stdForm">
        <label>Email</label>
        <input type="email" id="stdEmail" required>
        <label>Password</label>
        <input type="password" id="stdPassword" required>
        <button class="btn btn-primary btn-block" style="margin-top:18px" type="submit">Log in</button>
      </form>
      <p class="muted" style="margin-top:10px;"><a href="forgot-password.html">Forgot your password?</a></p>
    </div>

    <div class="tab-panel" id="panel-agent">
      <h2>Agent login</h2>
      <p class="muted">For delivery agents only.</p>
      <div id="agent-alert"></div>
      <form id="agentForm">
        <label>Email</label>
        <input type="email" id="agentEmail" required>
        <label>Password</label>
        <input type="password" id="agentPassword" required>
        <button class="btn btn-primary btn-block" style="margin-top:18px" type="submit">Log in as agent</button>
      </form>
      <p class="muted" style="margin-top:10px;"><a href="forgot-password.html">Forgot your password?</a></p>
    </div>

    <p class="muted" style="margin-top:16px;">No account? <a href="register.html">Register here</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(`panel-${tab.dataset.tab}`).classList.add("active");
  });
});

function redirectByRole(role) {
  if (role === "FARMER") location.href = "farmer/dashboard.html";
  else if (role === "ADMIN") location.href = "admin/dashboard.html";
  else if (role === "AGENT") location.href = "agent/dashboard.html";
  else location.href = "shop.html";
}

document.getElementById("stdForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const box = document.getElementById("std-alert");
  box.innerHTML = "";
  try {
    const auth = await api.login({
      email: document.getElementById("stdEmail").value.trim(),
      password: document.getElementById("stdPassword").value
    });
    session.save(auth);
    toast(`Welcome back, ${auth.fullName || ""}`);
    redirectByRole(auth.role);
  } catch (err) {
    box.innerHTML = `<div class="alert alert-err">${err.message}</div>`;
  }
});

document.getElementById("agentForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const box = document.getElementById("agent-alert");
  box.innerHTML = "";
  try {
    const auth = await api.agentLogin({
      email: document.getElementById("agentEmail").value.trim(),
      password: document.getElementById("agentPassword").value
    });
    session.save(auth);
    toast(`Welcome back, ${auth.fullName || ""}`);
    location.href = "agent/dashboard.html";
  } catch (err) {
    box.innerHTML = `<div class="alert alert-err">${err.message}</div>`;
  }
});
</script>
</body>
</html>
