<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="img/logo-icon.png">
<title>Checkout — FarmFresh</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<div id="toast-root"></div>
<div id="nav"></div>

<div class="container page" style="max-width:640px;">
  <h2>Checkout</h2>

  <div class="section-head"><h3>Delivery address</h3></div>
  <div id="addressBox" class="card" style="margin-bottom:20px;"><p class="muted">Loading addresses…</p></div>

  <div id="newAddressForm" class="card" style="display:none;margin-bottom:20px;">
    <h4>New address</h4>
    <label>Full name</label><input id="na_fullName" required>
    <div class="field-row">
      <div><label>Mobile number</label><input id="na_mobile" required pattern="[6-9][0-9]{9}"></div>
      <div><label>Pincode</label><input id="na_pincode" required pattern="[1-9][0-9]{5}"></div>
    </div>
    <label>Address line</label><input id="na_addressLine" required>
    <div class="field-row">
      <div><label>City</label><input id="na_city" required></div>
      <div><label>State</label><input id="na_state" required></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-weight:400;">
      <input type="checkbox" id="na_isDefault" style="width:auto;"> Set as default address
    </label>
    <div id="newAddress-alert"></div>
    <button class="btn btn-primary" style="margin-top:10px" id="saveAddressBtn">Save address</button>
  </div>

  <div id="cartSummary" class="card" style="margin-bottom:20px;"><p class="muted">Loading cart…</p></div>

  <form id="checkoutForm" class="card">
    <input type="hidden" id="addressId" required>

    <label>Coupon code (optional)</label>
    <input id="couponCode" placeholder="No /api/coupons endpoint exists — informational only">

    <label>Payment method</label>
    <select id="paymentMethod">
      <option value="COD">Cash on delivery</option>
      <option value="RAZORPAY">Pay online (Razorpay)</option>
    </select>

    <div id="checkout-alert" style="margin-top:10px;"></div>
    <button class="btn btn-primary btn-block" style="margin-top:16px" type="submit">Place order</button>
  </form>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
// Fill in a Razorpay TEST key_id here to enable the online-payment path locally.
// The backend never exposes razorpay.key-id over the API, so this must be set
// manually and must match the key-id in the backend's application.properties.
const RAZORPAY_KEY_ID = "rzp_test_your_key_id_here";

if (requireAuth(["BUYER"])) { loadAddresses(); loadCartSummary(); }

let selectedAddressId = null;

async function loadAddresses() {
  const box = document.getElementById("addressBox");
  try {
    const addresses = await api.myAddresses();
    if (!addresses.length) {
      box.innerHTML = `<p class="muted">No saved addresses yet.</p>`;
      document.getElementById("newAddressForm").style.display = "block";
      return;
    }
    const defaultAddr = addresses.find(a => a.default) || addresses[0];
    selectedAddressId = defaultAddr.id;
    document.getElementById("addressId").value = selectedAddressId;

    box.innerHTML = `
      ${addresses.map(a => `
        <label style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-weight:400;">
          <input type="radio" name="addrRadio" style="width:auto;margin-top:4px;" value="${a.id}" ${a.id === selectedAddressId ? "checked" : ""}>
          <span>
            <strong>${a.fullName}</strong> ${a.default ? '<span class="badge badge-active">Default</span>' : ''}<br>
            <span class="muted">${a.addressLine}, ${a.city}, ${a.state} - ${a.pincode} · ${a.mobileNumber}</span>
          </span>
        </label>`).join("")}
      <button type="button" class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="document.getElementById('newAddressForm').style.display='block'">+ Add new address</button>
    `;
    document.querySelectorAll('input[name="addrRadio"]').forEach(r => {
      r.addEventListener("change", (e) => {
        selectedAddressId = Number(e.target.value);
        document.getElementById("addressId").value = selectedAddressId;
      });
    });
  } catch (e) {
    box.innerHTML = `<div class="alert alert-err">${e.message}</div>`;
  }
}

document.getElementById("saveAddressBtn").addEventListener("click", async () => {
  const alertBox = document.getElementById("newAddress-alert");
  alertBox.innerHTML = "";
  try {
    const addr = await api.createAddress({
      fullName: na_fullName.value.trim(),
      mobileNumber: na_mobile.value.trim(),
      addressLine: na_addressLine.value.trim(),
      city: na_city.value.trim(),
      state: na_state.value.trim(),
      pincode: na_pincode.value.trim(),
      isDefault: na_isDefault.checked
    });
    toast("Address saved");
    document.getElementById("newAddressForm").style.display = "none";
    selectedAddressId = addr.id;
    document.getElementById("addressId").value = selectedAddressId;
    loadAddresses();
  } catch (e) {
    alertBox.innerHTML = `<div class="alert alert-err">${e.message}</div>`;
  }
});

async function loadCartSummary() {
  const box = document.getElementById("cartSummary");
  try {
    const cart = await api.getCart();
    if (!cart.items || !cart.items.length) {
      box.innerHTML = `<p class="muted">Your cart is empty. <a href="shop.html">Go shopping →</a></p>`;
      document.querySelector("#checkoutForm button").disabled = true;
      return;
    }
    box.innerHTML = `
      ${cart.items.map(i => `<div class="flex-between"><span>${i.productName} × ${i.quantity}</span><span>${money(i.subtotal)}</span></div>`).join("")}
      <hr style="border:none;border-top:1px solid var(--line);margin:10px 0;">
      <div class="flex-between"><strong>Total</strong><strong>${money(cart.totalAmount)}</strong></div>
    `;
  } catch (e) {
    box.innerHTML = `<div class="alert alert-err">${e.message}</div>`;
  }
}

document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const box = document.getElementById("checkout-alert");
  box.innerHTML = "";
  const paymentMethod = document.getElementById("paymentMethod").value;
  if (!document.getElementById("addressId").value) {
    box.innerHTML = `<div class="alert alert-err">Please add or select a delivery address first.</div>`;
    return;
  }

  try {
    const order = await api.checkout({
      addressId: Number(document.getElementById("addressId").value),
      couponCode: document.getElementById("couponCode").value.trim() || undefined,
      paymentMethod
    });

    if (paymentMethod === "COD") {
      location.href = `order-success.html?orderId=${order.orderId}`;
      return;
    }

    // RAZORPAY path
    const paymentOrder = await api.createPaymentOrder({
      orderId: order.orderId,
      amount: Math.round(order.totalAmount)
    });

    const rzp = new Razorpay({
      key: RAZORPAY_KEY_ID,
      amount: paymentOrder.amount ? paymentOrder.amount * 100 : Math.round(order.totalAmount * 100),
      currency: paymentOrder.currency || "INR",
      order_id: paymentOrder.razorpayOrderId,
      name: "FarmFresh",
      description: `Order ${order.orderNumber}`,
      handler: async function (response) {
        try {
          await api.verifyPayment({
            orderId: order.orderId,
            razorpayOrderId: response.razorpay_order_id,
            razorpayPaymentId: response.razorpay_payment_id,
            razorpaySignature: response.razorpay_signature
          });
          location.href = `order-success.html?orderId=${order.orderId}`;
        } catch (err) {
          box.innerHTML = `<div class="alert alert-err">Payment captured but verification failed: ${err.message}</div>`;
        }
      },
      theme: { color: "#2F5233" }
    });
    rzp.open();

  } catch (err) {
    box.innerHTML = `<div class="alert alert-err">${err.message}</div>`;
  }
});
</script>
</body>
</html>
